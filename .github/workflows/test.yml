name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One debug build (selfcheck, which doubles as the warnings gate), one
  # release build (`make app`) and the iOS bundle. No macOS version matrix —
  # SwiftUI/AppKit APIs used here (Package.swift pins .macOS(.v14)) aren't
  # available on older runners, and there's only one platform this app ships
  # for.
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Debug, not release: -O deletes every `assert`, which is the whole
      # selfcheck mechanism (see Scripts/selfcheck.sh). SelfTest itself
      # refuses to run under -O rather than reporting a hollow pass, so this
      # would fail loudly rather than silently if it were ever built wrong.
      #
      # This is also the zero-warnings gate (the standing rule in CLAUDE.md):
      # the debug build is the first one on a fresh checkout, so it is a clean
      # build and every file's diagnostics are emitted. That only holds while
      # nothing before this step builds — swift build re-emits diagnostics
      # solely for the files it recompiles.
      - name: Selfcheck, warnings as errors
        run: make selfcheck SWIFT_BUILD_FLAGS="-Xswiftc -warnings-as-errors"

      # Confirms a release build still produces a working, ad-hoc-signed
      # bundle — the shape release.yml ships. Not a substitute for selfcheck
      # above, which needs the debug build to keep its asserts.
      - name: Release build + app bundle
        run: make app

      # `Sources/MoomuxiOS` is not a SwiftPM target — it is compiled by a bare
      # `swiftc` in `make ios` — so nothing above type-checks a line of it.
      # Without this a phone-only file can break and every other check stays
      # green.
      #
      # The one step that needs an iOS SDK, so it pins the toolchain rather
      # than inheriting whichever Xcode the image defaults to — `make ios`
      # reads the SDK path out of `xcrun`, and the macOS steps above stay on
      # the CommandLineTools toolchain the dev machine uses. The `xcrun` line
      # is there so an image without that SDK says so in one line rather than
      # as forty "unable to load standard library" errors.
      - name: iOS bundle
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          xcrun --sdk iphonesimulator --show-sdk-path
          make ios

  # Plain bash and git, no macOS toolchain, so it skips the macOS runner.
  version-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release version rules
        run: ./Scripts/next_version_test.sh
